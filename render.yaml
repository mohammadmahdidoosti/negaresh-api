services:
  - type: web
    name: negaresh
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: API_KEY
        sync: false
      - key: NEGARESH_API_KEY
        generateValue: true
      - key: BETA_ACCESS_SECRET
        generateValue: true
